<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Learning Tracker</title>
<meta name="description" content="Track your daily learning across Science, History, Personal Skills, Business, and Arts. Build streaks and grow every day.">
<meta name="theme-color" content="#0d0d0f">

<!-- Favicon (PNG) -->
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<!-- SVG favicon fallback (inline data URI) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d0f'/%3E%3Cpath d='M7 9a2 2 0 0 1 2-2h5.5v16H9a2 2 0 0 1-2-2V9z' fill='%23e07b39'/%3E%3Cpath d='M17.5 7H23a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5.5V7z' fill='%23f0c040'/%3E%3Crect x='15' y='7' width='2' height='16' rx='1' fill='%230d0d0f' opacity='.6'/%3E%3C/svg%3E">
<!-- Apple touch icon -->
<link rel="apple-touch-icon" sizes="512x512" href="icon.png">
<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #141417;
    --surface2: #1c1c21;
    --border: #2a2a32;
    --accent: #f0c040;
    --accent2: #e07b39;
    --text: #f0ede6;
    --muted: #7a7a8a;
    --green: #4caf82;
    --science: #4a9eff;
    --history: #c97b3a;
    --personal: #9b72cf;
    --business: #4caf82;
    --arts: #e05a7a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(240,192,64,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 90%, rgba(224,123,57,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 960px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

  /* Header */
  header {
    padding: 40px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 36px;
  }
  .header-inner { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; }
  .logo-eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    font-weight: 500;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 900;
    line-height: 1.05;
    color: var(--text);
  }
  h1 span { color: var(--accent); }
  .header-meta { text-align: right; }
  .streak-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #0d0d0f;
    padding: 10px 20px;
    border-radius: 100px;
    font-weight: 700;
    font-size: 14px;
  }
  .streak-badge .fire { font-size: 18px; }

  /* Stats row */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    transition: border-color 0.2s;
  }
  .stat-card:hover { border-color: var(--accent); }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 8px; }
  .stat-value { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: var(--text); }
  .stat-value.accent { color: var(--accent); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; width: fit-content; }
  .tab {
    padding: 9px 22px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active { background: var(--accent); color: #0d0d0f; font-weight: 700; }
  .tab:hover:not(.active) { color: var(--text); }

  /* Log form */
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
  }
  .form-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 24px;
    color: var(--text);
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 7px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  input, select, textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select option { background: var(--surface2); }
  textarea { resize: vertical; min-height: 80px; }

  /* Area chips */
  .area-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 14px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    color: var(--muted);
    background: transparent;
  }
  .chip:hover { border-color: var(--text); color: var(--text); }
  .chip.selected { color: #0d0d0f; font-weight: 700; border-color: transparent; }
  .chip[data-area="Science & Technology"].selected { background: var(--science); }
  .chip[data-area="History & Culture"].selected { background: var(--history); }
  .chip[data-area="Personal Skills"].selected { background: var(--personal); }
  .chip[data-area="Business & Finance"].selected { background: var(--business); }
  .chip[data-area="Arts & Creativity"].selected { background: var(--arts); }

  .submit-btn {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #0d0d0f;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 0.02em;
  }
  .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--green);
    color: #fff;
    padding: 14px 28px;
    border-radius: 100px;
    font-weight: 600;
    font-size: 14px;
    z-index: 999;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: #e05a5a; }

  /* History */
  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .history-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-chip {
    padding: 6px 14px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    color: var(--muted);
    background: transparent;
  }
  .filter-chip.active { border-color: var(--accent); color: var(--accent); }

  .entries-list { display: flex; flex-direction: column; gap: 10px; }
  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 14px;
    align-items: start;
    transition: border-color 0.2s;
  }
  .entry-card:hover { border-color: var(--border); }
  .area-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }
  .entry-topic { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .entry-meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .entry-notes { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .entry-date { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }

  .area-pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 700;
    color: #0d0d0f;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; }

  .loading-state {
    text-align: center;
    padding: 40px;
    color: var(--muted);
  }

  /* Heatmap */
  .heatmap-section { margin-bottom: 28px; }
  .heatmap-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; margin-bottom: 16px; }
  .heatmap-grid {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .heatmap-day {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    background: var(--surface2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.1s;
    position: relative;
  }
  .heatmap-day:hover { transform: scale(1.3); z-index: 1; }
  .heatmap-day.has-entry { border-color: transparent; }
  .heatmap-day.level-1 { background: rgba(240,192,64,0.3); }
  .heatmap-day.level-2 { background: rgba(240,192,64,0.6); }
  .heatmap-day.level-3 { background: rgba(240,192,64,0.85); }
  .heatmap-day.level-4 { background: var(--accent); }

  .area-breakdown { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
  .area-row { display: flex; align-items: center; gap: 12px; }
  .area-name { font-size: 13px; width: 160px; flex-shrink: 0; }
  .area-bar-bg { flex: 1; height: 8px; background: var(--surface2); border-radius: 100px; overflow: hidden; }
  .area-bar { height: 100%; border-radius: 100px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
  .area-count { font-size: 13px; color: var(--muted); width: 30px; text-align: right; }

  /* Search bar */
  .search-wrap { margin-bottom: 16px; position: relative; }
  .search-wrap input { padding-left: 38px; background: var(--surface); border-color: var(--border); }
  .search-wrap::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; pointer-events: none; z-index: 1; }

  /* Entry action buttons */
  .entry-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .entry-actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
  .entry-card:hover .entry-actions { opacity: 1; }
  .action-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 4px 8px; font-size: 13px; cursor: pointer; color: var(--muted); transition: all 0.18s; }
  .action-btn:hover { border-color: var(--accent); color: var(--text); }
  .action-btn.del:hover { border-color: #e05a5a; color: #e05a5a; }

  /* Goal card */
  .goal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 22px; margin-bottom: 18px; }
  .goal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .goal-label { font-size: 13px; font-weight: 600; color: var(--text); }
  .goal-set-btn { font-size: 11px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; border-radius: 100px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
  .goal-set-btn:hover { border-color: var(--accent); color: var(--accent); }
  .goal-nums { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .goal-nums strong { color: var(--text); }
  .goal-bar-bg { height: 8px; background: var(--surface2); border-radius: 100px; overflow: hidden; }
  .goal-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 100px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
  .goal-met-msg { margin-top: 10px; font-size: 13px; color: var(--green); font-weight: 600; }

  /* Confetti canvas */
  #confettiCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 9998; display: none; }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .entry-card { grid-template-columns: auto 1fr; }
    .entry-date { grid-column: 2; }
  }

  /* Secret sheet button — invisible, only I know */
  #secretSheetBtn {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 40px;
    height: 40px;
    background: transparent;
    border: none;
    cursor: default;
    z-index: 9999;
    opacity: 0;
    outline: none;
  }
</style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>
<div class="container">
  <header>
    <div class="header-inner">
      <div class="logo-block">
        <div class="logo-eyebrow">📚 Personal Growth</div>
        <h1>Daily Learning<br><span>Tracker</span></h1>
      </div>
      <div class="header-meta">
        <div class="streak-badge"><span class="fire">🔥</span> <span id="streakCount">0</span> day streak</div>
      </div>
    </div>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Entries</div>
      <div class="stat-value accent" id="totalEntries">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">This Week</div>
      <div class="stat-value" id="weekEntries">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Top Area</div>
      <div class="stat-value" id="topArea" style="font-size:18px;">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg / Day</div>
      <div class="stat-value" id="avgTime">—</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('log')">✏️ Log Today</button>
    <button class="tab" onclick="switchTab('history')">📋 History</button>
    <button class="tab" onclick="switchTab('insights')">📊 Insights</button>
  </div>

  <!-- LOG PANEL -->
  <div class="panel active" id="panel-log">
    <!-- Daily Goal Card -->
    <div class="goal-card" id="goalCard">
      <div class="goal-header">
        <div class="goal-label">🎯 Today's Goal</div>
        <button class="goal-set-btn" onclick="promptGoal()">⚙️ Set Goal</button>
      </div>
      <div class="goal-nums"><span>Loading...</span></div>
      <div class="goal-bar-bg"><div class="goal-bar" id="goalBar" style="width:0%"></div></div>
    </div>
    <div class="form-card">
      <div class="form-title">What did you learn today? ✨</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="entryDate">
        </div>
        <div class="form-group">
          <label>Time Spent (mins)</label>
          <input type="number" id="timeSpent" placeholder="e.g. 30" min="1">
        </div>
        <div class="form-group full">
          <label>Topic / What you learned</label>
          <input type="text" id="topic" placeholder="e.g. How black holes form, Excel VLOOKUP...">
        </div>
        <div class="form-group full">
          <label>Area</label>
          <div class="area-chips">
            <button class="chip" data-area="Science & Technology" onclick="selectArea(this)">🔬 Science & Tech</button>
            <button class="chip" data-area="History & Culture" onclick="selectArea(this)">🏛️ History & Culture</button>
            <button class="chip" data-area="Personal Skills" onclick="selectArea(this)">🧠 Personal Skills</button>
            <button class="chip" data-area="Business & Finance" onclick="selectArea(this)">💼 Business & Finance</button>
            <button class="chip" data-area="Arts & Creativity" onclick="selectArea(this)">🎨 Arts & Creativity</button>
          </div>
        </div>
        <div class="form-group full">
          <label>Notes / Key takeaway</label>
          <textarea id="notes" placeholder="What's the one thing you'll remember from this?"></textarea>
        </div>
      </div>
      <button class="submit-btn" id="submitBtn" onclick="submitEntry()">Save to Google Sheets ✓</button>
    </div>
  </div>

  <!-- HISTORY PANEL -->
  <div class="panel" id="panel-history">
    <div class="history-header">
      <div class="history-title">Your Learning History</div>
      <div class="search-wrap"><input type="text" id="searchInput" placeholder="Search topics, notes..." oninput="renderEntries()"></div>
      <div class="filter-row">
        <button class="filter-chip active" data-filter="All" onclick="setFilter(this)">All</button>
        <button class="filter-chip" data-filter="Science & Technology" onclick="setFilter(this)">🔬 Science</button>
        <button class="filter-chip" data-filter="History & Culture" onclick="setFilter(this)">🏛️ History</button>
        <button class="filter-chip" data-filter="Personal Skills" onclick="setFilter(this)">🧠 Personal</button>
        <button class="filter-chip" data-filter="Business & Finance" onclick="setFilter(this)">💼 Business</button>
        <button class="filter-chip" data-filter="Arts & Creativity" onclick="setFilter(this)">🎨 Arts</button>
      </div>
    </div>
    <div class="entries-list" id="entriesList">
      <div class="loading-state">Loading your entries...</div>
    </div>
  </div>

  <!-- INSIGHTS PANEL -->
  <div class="panel" id="panel-insights">
    <div class="heatmap-section">
      <div class="heatmap-title">Activity — Last 3 Months</div>
      <div class="heatmap-grid" id="heatmapGrid"></div>
    </div>
    <div class="form-card">
      <div class="form-title" style="margin-bottom:16px;">Area Breakdown</div>
      <div class="area-breakdown" id="areaBreakdown"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Secret button: bottom-left corner, invisible -->
<button id="secretSheetBtn" onclick="window.open('https://docs.google.com/spreadsheets/d/1pkQG-BDxQlkDwwyuUVuVwBBiFt6sYrnpT2glLkQqPO4/edit', '_blank')" title="" aria-hidden="true"></button>

<script>
// ── PWA Service Worker ──────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
}

// ── Constants ───────────────────────────────────────
const API_URL = "https://script.google.com/macros/s/AKfycbxbLxoSd123d-hB4CK4aXMwUYec3TseNGWQv_i2LvRPYpcpcmn0fIZV5u-xFoZZBnRnPA/exec";
const CACHE_KEY = 'dlt_entries';
const GOAL_KEY  = 'dlt_goal';
const STREAK_MILESTONES = [7, 14, 21, 30, 50, 100];

const AREA_COLORS = {
  "Science & Technology": "#4a9eff",
  "History & Culture":    "#c97b3a",
  "Personal Skills":      "#9b72cf",
  "Business & Finance":   "#4caf82",
  "Arts & Creativity":    "#e05a7a"
};

// ── State ───────────────────────────────────────────
let allEntries    = [];
let selectedArea  = "";
let currentFilter = "All";
let editingEntry  = null;   // original entry being edited
let dailyGoal     = parseInt(localStorage.getItem(GOAL_KEY)) || 30;
let confettiAF    = null;

// Init
document.getElementById('entryDate').valueAsDate = new Date();

// ── Tabs ────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['log','history','insights'][i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'history' || name === 'insights') loadEntries();
  if (name === 'log') renderGoalCard();
}

// ── Area chips ──────────────────────────────────────
function selectArea(el) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedArea = el.dataset.area;
}

// ── Filter ──────────────────────────────────────────
function setFilter(el) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentFilter = el.dataset.filter;
  renderEntries();
}

// ── Toast ───────────────────────────────────────────
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '') + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Goal ────────────────────────────────────────────
function promptGoal() {
  const val = prompt('Set your daily learning goal (minutes):', dailyGoal);
  if (val && parseInt(val) > 0) {
    dailyGoal = parseInt(val);
    localStorage.setItem(GOAL_KEY, dailyGoal);
    renderGoalCard();
  }
}

function renderGoalCard() {
  const today = new Date().toISOString().split('T')[0];
  const todayMins = allEntries
    .filter(e => e.Date === today)
    .reduce((s, e) => s + (parseInt(e['Time Spent']) || 0), 0);
  const pct = Math.min(100, Math.round(todayMins / dailyGoal * 100));
  const wasGoalMet = todayMins >= dailyGoal;

  document.querySelector('#goalCard .goal-nums').innerHTML =
    `<span>Today: <strong>${todayMins} mins</strong></span><span>Goal: <strong>${dailyGoal} mins</strong></span>`;
  document.getElementById('goalBar').style.width = pct + '%';

  const existing = document.querySelector('.goal-met-msg');
  if (existing) existing.remove();
  if (wasGoalMet) {
    const msg = document.createElement('div');
    msg.className = 'goal-met-msg';
    msg.textContent = '🎉 Daily goal smashed!';
    document.getElementById('goalCard').appendChild(msg);
  }
  return { wasGoalMet, todayMins };
}

// ── Confetti ────────────────────────────────────────
function launchConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  const colors = ['#f0c040','#e07b39','#4a9eff','#4caf82','#9b72cf','#e05a7a','#fff'];
  const particles = Array.from({ length: 140 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    w: Math.random() * 10 + 5,
    h: Math.random() * 6 + 3,
    color: colors[Math.floor(Math.random() * colors.length)],
    vx: (Math.random() - 0.5) * 3,
    vy: Math.random() * 4 + 2,
    rot: Math.random() * 360,
    rotV: (Math.random() - 0.5) * 8,
    alpha: 1
  }));
  if (confettiAF) cancelAnimationFrame(confettiAF);
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.rotV; p.alpha -= 0.007;
      if (p.alpha <= 0) return;
      alive = true;
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (alive) confettiAF = requestAnimationFrame(draw);
    else { canvas.style.display = 'none'; ctx.clearRect(0, 0, canvas.width, canvas.height); }
  }
  draw();
}

// ── Submit / Update entry ───────────────────────────
async function submitEntry() {
  const date      = document.getElementById('entryDate').value;
  const topic     = document.getElementById('topic').value.trim();
  const timeSpent = document.getElementById('timeSpent').value;
  const notes     = document.getElementById('notes').value.trim();

  if (!date || !topic || !selectedArea) {
    showToast('Please fill in date, topic, and area!', true); return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = editingEntry ? 'Updating...' : 'Saving...';

  try {
    if (editingEntry) {
      // Update locally
      const idx = allEntries.findIndex(e => e.Date === editingEntry.Date && e.Topic === editingEntry.Topic);
      if (idx !== -1) {
        allEntries[idx] = { ...allEntries[idx], Date: date, Topic: topic, Area: selectedArea, 'Time Spent': timeSpent || 0, Notes: notes };
        localStorage.setItem(CACHE_KEY, JSON.stringify(allEntries));
      }
      // Push to Apps Script (needs updateEntry handler on the sheet side)
      fetch(API_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'updateEntry', originalDate: editingEntry.Date, originalTopic: editingEntry.Topic, date, topic, area: selectedArea, timeSpent: timeSpent || 0, notes })
      });
      showToast('✏️ Entry updated!');
    } else {
      const streak = calculateStreak(date);
      await fetch(API_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'addEntry', date, topic, area: selectedArea, timeSpent: timeSpent || 0, notes, streak })
      });
      // Optimistic local add
      allEntries.unshift({ Date: date, Topic: topic, Area: selectedArea, 'Time Spent': timeSpent || 0, Notes: notes, Streak: streak });
      localStorage.setItem(CACHE_KEY, JSON.stringify(allEntries));
      showToast('✓ Saved to Google Sheets!');

      // Check streak milestones
      if (STREAK_MILESTONES.includes(streak)) launchConfetti();
    }

    clearForm();
    updateStats();
    renderEntries();
    renderHeatmap();
    renderAreaBreakdown();

    // Check goal hit
    const { wasGoalMet, todayMins } = renderGoalCard();
    const prevMins = todayMins - (parseInt(timeSpent) || 0);
    if (wasGoalMet && prevMins < dailyGoal) launchConfetti();

  } catch (err) {
    showToast('Error saving. Check your connection.', true);
  }

  btn.disabled = false;
  btn.textContent = 'Save to Google Sheets ✓';
  editingEntry = null;
}

function clearForm() {
  document.getElementById('topic').value = '';
  document.getElementById('timeSpent').value = '';
  document.getElementById('notes').value = '';
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
  selectedArea = '';
}

// ── Edit entry ──────────────────────────────────────
function editEntry(i) {
  const e = getFilteredEntries()[i];
  if (!e) return;
  editingEntry = { ...e };

  document.getElementById('entryDate').value = e.Date || '';
  document.getElementById('topic').value     = e.Topic || '';
  document.getElementById('timeSpent').value = e['Time Spent'] || '';
  document.getElementById('notes').value     = e.Notes || '';

  document.querySelectorAll('.chip').forEach(c => {
    const isMatch = c.dataset.area === e.Area;
    c.classList.toggle('selected', isMatch);
    if (isMatch) selectedArea = e.Area;
  });

  document.getElementById('submitBtn').textContent = '✏️ Update Entry';
  switchTab('log');
  document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth' });
}

// ── Delete entry ────────────────────────────────────
function deleteEntry(i) {
  const e = getFilteredEntries()[i];
  if (!e) return;
  if (!confirm(`Delete "${e.Topic}"?`)) return;

  const idx = allEntries.findIndex(en => en.Date === e.Date && en.Topic === e.Topic);
  if (idx !== -1) allEntries.splice(idx, 1);
  localStorage.setItem(CACHE_KEY, JSON.stringify(allEntries));
  updateStats(); renderEntries(); renderGoalCard();
  showToast('🗑️ Entry deleted');

  // Push to Apps Script (needs deleteEntry handler on the sheet side)
  fetch(API_URL, {
    method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'deleteEntry', date: e.Date, topic: e.Topic })
  }).catch(() => {});
}

// ── Streak ──────────────────────────────────────────
function calculateStreak(newDate) {
  if (!allEntries.length) return 1;
  const dates = [...new Set(allEntries.map(e => e.Date).filter(Boolean))].sort().reverse();
  const today = new Date(newDate);
  let streak = 1;
  for (let i = 0; i < dates.length; i++) {
    const diff = Math.round((today - new Date(dates[i])) / 86400000);
    if (diff === streak) streak++;
    else if (diff > streak) break;
  }
  return streak;
}

// ── Load entries ─────────────────────────────────────
async function loadEntries() {
  // Show cached data immediately
  const cached = localStorage.getItem(CACHE_KEY);
  if (cached) {
    try {
      allEntries = JSON.parse(cached);
      updateStats(); renderEntries(); renderHeatmap(); renderAreaBreakdown(); renderGoalCard();
    } catch (_) {}
  }
  // Then refresh from API
  try {
    const res  = await fetch(API_URL + '?t=' + Date.now());
    const json = await res.json();
    if (json.success) {
      allEntries = (json.data || []).filter(e => e.Date || e.Topic).reverse();
      localStorage.setItem(CACHE_KEY, JSON.stringify(allEntries));
      updateStats(); renderEntries(); renderHeatmap(); renderAreaBreakdown(); renderGoalCard();
    }
  } catch (_) {
    if (!cached) {
      document.getElementById('entriesList').innerHTML =
        '<div class="empty-state"><div class="icon">⚠️</div><p>Could not load entries. Check your Apps Script URL.</p></div>';
    }
  }
}

// ── Stats ────────────────────────────────────────────
function updateStats() {
  document.getElementById('totalEntries').textContent = allEntries.length;
  const oneWeekAgo = new Date(); oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
  document.getElementById('weekEntries').textContent = allEntries.filter(e => new Date(e.Date) >= oneWeekAgo).length;

  const areaCounts = {};
  allEntries.forEach(e => { if (e.Area) areaCounts[e.Area] = (areaCounts[e.Area] || 0) + 1; });
  const topArea = Object.entries(areaCounts).sort((a, b) => b[1] - a[1])[0];
  const areaEmojis = {"Science & Technology":"🔬","History & Culture":"🏛️","Personal Skills":"🧠","Business & Finance":"💼","Arts & Creativity":"🎨"};
  document.getElementById('topArea').textContent = topArea ? (areaEmojis[topArea[0]] || '') + ' ' + topArea[0].split(' ')[0] : '—';

  const times = allEntries.map(e => parseInt(e['Time Spent']) || 0).filter(t => t > 0);
  const avg = times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) : 0;
  document.getElementById('avgTime').textContent = avg ? avg + 'm' : '—';

  document.getElementById('streakCount').textContent = allEntries[0] ? (parseInt(allEntries[0].Streak) || 0) : 0;
}

// ── Filtered entries (respects search + area filter) ─
function getFilteredEntries() {
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  return allEntries
    .filter(e => currentFilter === 'All' || e.Area === currentFilter)
    .filter(e => !q || (e.Topic || '').toLowerCase().includes(q) || (e.Notes || '').toLowerCase().includes(q));
}

// ── Render history ───────────────────────────────────
function renderEntries() {
  const list    = document.getElementById('entriesList');
  const entries = getFilteredEntries();
  if (!entries.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📖</div><p>No entries found.</p></div>';
    return;
  }
  list.innerHTML = entries.map((e, i) => {
    const color   = AREA_COLORS[e.Area] || '#7a7a8a';
    const dateStr = e.Date ? new Date(e.Date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    return `
    <div class="entry-card">
      <div class="area-dot" style="background:${color}"></div>
      <div>
        <div class="entry-topic">${e.Topic || '—'}</div>
        <div class="entry-meta">
          <span class="area-pill" style="background:${color}">${e.Area || ''}</span>
          ${e['Time Spent'] ? `⏱ ${e['Time Spent']} mins` : ''}
        </div>
        ${e.Notes ? `<div class="entry-notes">${e.Notes}</div>` : ''}
      </div>
      <div class="entry-right">
        <div class="entry-date">${dateStr}</div>
        <div class="entry-actions">
          <button class="action-btn" onclick="editEntry(${i})" title="Edit">✏️</button>
          <button class="action-btn del" onclick="deleteEntry(${i})" title="Delete">🗑️</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Heatmap ──────────────────────────────────────────
function renderHeatmap() {
  const grid = document.getElementById('heatmapGrid');
  const dateCounts = {};
  allEntries.forEach(e => { if (e.Date) dateCounts[e.Date] = (dateCounts[e.Date] || 0) + 1; });
  const days = [];
  const today = new Date();
  for (let i = 89; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = d.toISOString().split('T')[0];
    days.push({ key, count: dateCounts[key] || 0 });
  }
  grid.innerHTML = days.map(d => {
    let level = d.count === 1 ? 2 : d.count === 2 ? 3 : d.count >= 3 ? 4 : 0;
    return `<div class="heatmap-day ${d.count > 0 ? 'has-entry level-' + level : ''}" title="${d.key}: ${d.count} entr${d.count === 1 ? 'y' : 'ies'}"></div>`;
  }).join('');
}

// ── Area breakdown ───────────────────────────────────
function renderAreaBreakdown() {
  const breakdown  = document.getElementById('areaBreakdown');
  const areas      = ["Science & Technology","History & Culture","Personal Skills","Business & Finance","Arts & Creativity"];
  const areaCounts = {}; areas.forEach(a => areaCounts[a] = 0);
  allEntries.forEach(e => { if (e.Area && areaCounts[e.Area] !== undefined) areaCounts[e.Area]++; });
  const max    = Math.max(...Object.values(areaCounts), 1);
  const emojis = {"Science & Technology":"🔬","History & Culture":"🏛️","Personal Skills":"🧠","Business & Finance":"💼","Arts & Creativity":"🎨"};
  breakdown.innerHTML = areas.map(a => `
    <div class="area-row">
      <div class="area-name">${emojis[a]} ${a}</div>
      <div class="area-bar-bg"><div class="area-bar" style="width:${areaCounts[a]/max*100}%; background:${AREA_COLORS[a]}"></div></div>
      <div class="area-count">${areaCounts[a]}</div>
    </div>`).join('');
}

// ── Initial load ─────────────────────────────────────
loadEntries();
</script>
