<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Task Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Task Calendar">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        /* --- Base Styles --- */
        :root {
            /* Light Mode Colors */
            --bg-color: #f4f4f9;
            --text-color: #333;
            --app-bg-color: #ffffff;
            --app-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --header-bg-color: #007bff;
            --header-text-color: white;
            --grid-bg-color: #e9ecef;
            --day-label-bg-color: #dee2e6;
            --day-label-text-color: #555;
            --day-bg-color: #ffffff;
            --day-hover-bg-color: #f8f9fa;
            --day-text-color: #333;
            --day-border-color: transparent;
            --day-shadow-hover: 0 2px 8px rgba(0, 0, 0, 0.08);
            --today-border-color: #28a745;
            --today-shadow: 0 0 10px rgba(40, 167, 69, 0.3);
            --has-task-bg-color: #fff3cd;
            --has-task-border-color: #ffc107;
            --high-density-border-color: #dc3545;
            --weekend-bg-color: #cfe2ff;
            --weekend-text-color: #084298;
            --weekend-task-bg-color: #b9d3f3;
            --due-soon-border-color: #ffc107;
            --due-soon-shadow: 0 0 10px rgba(255, 193, 7, 0.5);
            --holiday-bg-color: #d4edda;
            --holiday-border-color: #28a745;
            --holiday-task-bg-color: #c3e6cb;
            --task-preview-text-color: #666;
            --task-preview-border-color: #eee;
            --task-preview-hover-color: #007bff;
            --modal-bg-color: #fefefe;
            --modal-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            --modal-text-color: #333;
            --modal-list-border-color: #eee;
            --modal-item-border-color: #eee;
            --modal-input-bg-color: #fff;
            --modal-input-text-color: #333;
            --modal-input-border-color: #ccc;
            --checkbox-border-color: #007bff;
            --checkbox-checked-bg-color: #007bff;
            --completed-text-color: #6c757d;
            --edit-button-bg-color: #ffc107;
            --edit-button-text-color: #333;
            --edit-button-border-color: #ffc107;
            --edit-button-hover-bg-color: #e0a800;
            --delete-button-bg-color: #dc3545;
            --delete-button-text-color: white;
            --delete-button-border-color: #dc3545;
            --delete-button-hover-bg-color: #c82333;
            --info-button-bg-color: #17a2b8;
            --info-button-hover-bg-color: #138496;
            --close-button-color: #aaa;
            --close-button-hover-color: #777;
            --priority-high-color: #dc3545;
            --priority-medium-color: #ffc107;
            --priority-low-color: #6c757d;

             /* Print specific */
             --print-bg-color: #fff;
             --print-text-color: #000;
             --print-header-bg-color: #fff;
             --print-header-text-color: #000;
             --print-separator-color: #ccc;
             --print-grid-bg-color: #fff;
             --print-day-label-bg-color: #eee;
             --print-day-label-text-color: #333;
             --print-day-border-color: #ddd;
             --print-today-border-color: #000;
             --print-has-task-bg-color: #f0f0f0;
             --print-has-task-border-color: #ccc;
             --print-weekend-bg-color: #e0e0e0;
             --print-weekend-task-bg-color: #d0d0d0;
             --print-holiday-bg-color: #d4edda;
             --print-holiday-border-color: #28a745;
             --print-holiday-task-bg-color: #c3e6cb;
             --print-task-preview-text-color: #333;
             --print-completed-text-color: #666;
        }

        body.dark-mode {
            --bg-color: #1e1e1e;
            --text-color: #e0e0e0;
            --app-bg-color: #2d2d2d;
            --app-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            --header-bg-color: #0056b3;
            --grid-bg-color: #3a3a3a;
            --day-label-bg-color: #4a4a4a;
            --day-label-text-color: #b0b0b0;
            --day-bg-color: #3a3a3a;
            --day-hover-bg-color: #4a4a4a;
            --day-text-color: #e0e0e0;
            --day-shadow-hover: 0 2px 8px rgba(0, 0, 0, 0.2);
            --today-border-color: #38c172;
            --today-shadow: 0 0 10px rgba(56, 193, 114, 0.4);
            --has-task-bg-color: #4a412a;
            --has-task-border-color: #d49a00;
            --high-density-border-color: #e3342f;
            --weekend-bg-color: #3a4a5a;
            --weekend-text-color: #a0c0e0;
            --weekend-task-bg-color: #4a5a6a;
            --due-soon-border-color: #d49a00;
            --due-soon-shadow: 0 0 10px rgba(212, 154, 0, 0.6);
            --holiday-bg-color: #28a745;
            --holiday-border-color: #38c172;
            --holiday-task-bg-color: #218838;
            --task-preview-text-color: #b0b0b0;
            --task-preview-border-color: #555;
            --task-preview-hover-color: #72a0ff;
            --modal-bg-color: #3a3a3a;
            --modal-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            --modal-text-color: #e0e0e0;
            --modal-list-border-color: #555;
            --modal-item-border-color: #555;
            --modal-input-bg-color: #4a4a4a;
            --modal-input-text-color: #e0e0e0;
            --modal-input-border-color: #555;
            --checkbox-border-color: #0056b3;
            --checkbox-checked-bg-color: #0056b3;
            --completed-text-color: #999;
            --edit-button-bg-color: #d49a00;
            --edit-button-text-color: white;
            --edit-button-border-color: #d49a00;
            --edit-button-hover-bg-color: #a07400;
            --delete-button-bg-color: #e3342f;
            --delete-button-border-color: #e3342f;
            --delete-button-hover-bg-color: #cb1b16;
            --info-button-bg-color: #20c997;
            --info-button-hover-bg-color: #1a9b7a;
            --close-button-color: #b0b0b0;
            --close-button-hover-color: #e0e0e0;
            --priority-high-color: #e3342f; /* Adjusted dark mode priority color */
            --priority-medium-color: #d49a00;
            --priority-low-color: #b0b0b0;
        }

        body.gray-mode {
            --bg-color: #cccccc;
            --text-color: #333333;
            --app-bg-color: #eeeeee;
            --app-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            --header-bg-color: #6c757d;
            --grid-bg-color: #dddddd;
            --day-label-bg-color: #cccccc;
            --day-label-text-color: #555555;
            --day-bg-color: #f8f8f8;
            --day-hover-bg-color: #eeeeee;
            --day-text-color: #333333;
            --day-shadow-hover: 0 2px 8px rgba(0, 0, 0, 0.1);
            --today-border-color: #5cb85c;
            --today-shadow: 0 0 10px rgba(92, 184, 92, 0.3);
            --has-task-bg-color: #ffeeba;
            --has-task-border-color: #ffc107;
            --high-density-border-color: #d9534f;
            --weekend-bg-color: #dddddd;
            --weekend-text-color: #555555;
            --weekend-task-bg-color: #cccccc;
            --due-soon-border-color: #ffc107;
            --due-soon-shadow: 0 0 10px rgba(255, 193, 7, 0.4);
            --holiday-bg-color: #bce8f1;
            --holiday-border-color: #31b0d5;
            --holiday-task-bg-color: #a6e1ec;
            --task-preview-text-color: #555555;
            --task-preview-border-color: #cccccc;
            --task-preview-hover-color: #007bff;
            --modal-bg-color: #eeeeee;
            --modal-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            --modal-text-color: #333333;
            --modal-list-border-color: #cccccc;
            --modal-item-border-color: #cccccc;
            --modal-input-bg-color: #dddddd;
            --modal-input-text-color: #333333;
            --modal-input-border-color: #bbbbbb;
            --checkbox-border-color: #007bff;
            --checkbox-checked-bg-color: #007bff;
            --completed-text-color: #555555;
            --edit-button-bg-color: #ffc107;
            --edit-button-text-color: #333333;
            --edit-button-border-color: #ffc107;
            --edit-button-hover-bg-color: #e0a800;
            --delete-button-bg-color: #d9534f;
            --delete-button-text-color: white;
            --delete-button-border-color: #d9534f;
            --delete-button-hover-bg-color: #c9302c;
            --info-button-bg-color: #6c757d;
            --info-button-hover-bg-color: #545b62;
            --close-button-color: #555555;
            --close-button-hover-color: #333333;
            --priority-high-color: #d9534f;
            --priority-medium-color: #ffc107;
            --priority-low-color: #777777; /* Adjusted gray mode priority low */
        }

        /* --- General Styles --- */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .main-layout {
            display: flex;
            width: 100%;
            max-width: 1400px; /* Increased max width */
            margin: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .calendar-container { /* New container for calendar and controls */
             flex-grow: 1;
             flex-basis: 600px;
             display: flex;
             flex-direction: column;
             gap: 10px; /* Gap between header/controls and grid */
        }

        .controls-and-search {
             display: flex;
             justify-content: space-between;
             align-items: center;
             padding: 10px 20px;
             background-color: var(--app-bg-color);
             border-radius: 8px;
             box-shadow: var(--app-shadow);
             flex-wrap: wrap;
             gap: 10px;
        }

         .controls-and-search input[type="search"],
         .controls-and-search select {
             padding: 8px 12px;
             border-radius: 5px;
             border: 1px solid var(--modal-input-border-color);
             background-color: var(--modal-input-bg-color);
             color: var(--modal-input-text-color);
             font-size: 0.9rem;
         }
          .controls-and-search button {
              padding: 8px 12px;
              font-size: 0.9rem;
          }

         .filter-controls {
             display: flex;
             gap: 10px;
             align-items: center;
         }


        .calendar-app {
            /* flex-grow: 1; Replaced by container */
            /* flex-basis: 600px; Replaced by container */
            background-color: var(--app-bg-color);
            border-radius: 12px;
            box-shadow: var(--app-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .month-task-view {
            flex-basis: 350px;
            flex-shrink: 0;
            background-color: var(--app-bg-color);
            border-radius: 12px;
            box-shadow: var(--app-shadow);
            padding: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 120px); /* Adjusted max height */
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        /* --- General Button Styles --- */
        button {
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease, border-color 0.3s ease, opacity 0.3s ease;
            border: none;
            color: var(--header-text-color); /* Default button text color */
            background-color: var(--header-bg-color); /* Default button background */
        }

        button:hover {
            opacity: 0.9;
        }
        button:active {
            opacity: 0.7;
        }

        /* Style for the task view toggle button and report/import/download */
        #toggleMonthViewButton, #downloadTasksButton, #importTasksButton, #downloadWordReportButton { /* Added new ID */
            background-color: var(--info-button-bg-color);
            color: white;
            margin-left: 5px; /* Adjusted margin slightly */
            padding: 5px 10px;
            font-size: 0.9rem; /* Slightly smaller font */
            white-space: nowrap; /* Prevent wrapping */
            border: none; /* Ensure no default border */
        }
        #toggleMonthViewButton:hover,
        #downloadTasksButton:hover,
        #importTasksButton:hover,
        #downloadWordReportButton:hover { /* Added new ID */
             background-color: var(--info-button-hover-bg-color);
             opacity: 1; /* Override general hover */
        }


        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--header-bg-color);
            color: var(--header-text-color);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            transition: background-color 0.3s ease;
            flex-wrap: wrap;
            gap: 5px; /* Reduced gap */
        }

        /* --- Header Navigation Button Styles --- */
        .calendar-header button {
            background-color: transparent;
            color: var(--header-text-color);
            border: 1px solid transparent;
            padding: 5px 10px;
            font-size: 1.5rem;
        }
        .calendar-header button:not(#darkModeToggle):not(#downloadTasksButton):not(#importTasksButton):not(#downloadWordReportButton):not(#toggleMonthViewButton):hover { /* Exclude styled buttons */
             background-color: rgba(255, 255, 255, 0.2);
             border-color: rgba(255, 255, 255, 0.5);
             opacity: 1; /* Override general hover */
         }
         body.dark-mode .calendar-header button:not(#darkModeToggle):not(#downloadTasksButton):not(#importTasksButton):not(#downloadWordReportButton):not(#toggleMonthViewButton):hover {
              background-color: rgba(255, 255, 255, 0.1);
              border-color: rgba(255, 255, 255, 0.3);
          }
         body.gray-mode .calendar-header button:not(#darkModeToggle):not(#downloadTasksButton):not(#importTasksButton):not(#downloadWordReportButton):not(#toggleMonthViewButton):hover {
             background-color: rgba(255, 255, 255, 0.1);
             border-color: rgba(255, 255, 255, 0.3);
         }

        /* Style for Year Navigation Buttons */
        .calendar-header #prevYear,
        .calendar-header #nextYear {
            font-size: 1.2rem;
            padding: 5px 8px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 1.8rem;
            flex-grow: 1;
            text-align: center;
             white-space: nowrap; /* Prevent wrapping */
        }

        /* Mode Toggle button specific style */
        #darkModeToggle {
             background-color: var(--info-button-bg-color); /* Match other info buttons */
             color: white;
             font-size: 0.9rem; /* Standard font size */
             padding: 5px 10px; /* Standard padding */
             border: none;
             margin-left: 5px;
             white-space: nowrap;
        }
         #darkModeToggle:hover {
              background-color: var(--info-button-hover-bg-color); /* Match hover */
              opacity: 1;
         }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            padding: 10px;
            background-color: var(--grid-bg-color);
            transition: background-color 0.3s ease;
        }

        .day-label {
            font-weight: bold;
            text-align: center;
            padding: 10px 0;
            color: var(--day-label-text-color);
            background-color: var(--day-label-bg-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .day {
            min-height: 100px;
            padding: 10px;
            background-color: var(--day-bg-color);
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease, border-color 0.3s ease;
            position: relative;
            overflow-y: auto;
            max-height: 150px;
            display: flex;
            flex-direction: column;
            color: var(--day-text-color);
            border: 1px solid var(--day-border-color); /* Use variable */
            /* Drag and Drop Styles */
             border: 2px dashed transparent; /* Placeholder for drop target highlight */
        }
        .day.drag-over { /* Style when dragging over a day */
             border-color: var(--header-bg-color); /* Highlight with accent color */
             background-color: var(--day-hover-bg-color);
        }


        .day:hover {
            background-color: var(--day-hover-bg-color);
            transform: translateY(-2px);
            box-shadow: var(--day-shadow-hover);
        }

        .day.today {
            border: 2px solid var(--today-border-color);
            box-shadow: var(--today-shadow);
        }

        .day.has-task {
            background-color: var(--has-task-bg-color);
            border: 1px solid var(--has-task-border-color);
        }
        .day.has-task.today { border-color: var(--today-border-color); }

        .day.high-density {
            border-width: 2px;
            border-style: dashed;
            border-color: var(--high-density-border-color);
        }
        .day.high-density.today { border-color: var(--today-border-color); }

        .day.weekend {
            background-color: var(--weekend-bg-color);
            color: var(--weekend-text-color);
        }
        .day.weekend.today { border-color: var(--today-border-color); }
        .day.weekend.has-task {
            background-color: var(--weekend-task-bg-color);
            border-color: var(--has-task-border-color);
        }
        .day.weekend.has-task.today { border-color: var(--today-border-color); }

        .day.due-soon {
            box-shadow: var(--due-soon-shadow);
            border-color: var(--due-soon-border-color);
        }
        .day.due-soon.today {
            border-color: var(--today-border-color);
            box-shadow: var(--today-shadow);
        }
        .day.due-soon.has-task { border-color: var(--due-soon-border-color); }
         /* Apply due-soon border even if holiday */
         .day.due-soon.holiday { border-color: var(--due-soon-border-color); }

        .day.holiday {
            background-color: var(--holiday-bg-color);
            border: 2px dashed var(--holiday-border-color);
        }
        .day.holiday.today { border-color: var(--today-border-color); }
        .day.holiday.has-task {
            background-color: var(--holiday-task-bg-color);
             /* Keep holiday border style unless also due-soon */
             border: 2px dashed var(--holiday-border-color);
        }
         .day.holiday.has-task.due-soon { /* Override if holiday task is due soon */
              border-color: var(--due-soon-border-color);
              border-style: solid; /* Use solid border for due-soon */
              border-width: 1px; /* Match other has-task border */
         }


        .day .day-number {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--day-text-color); /* Adjusted */
            margin-bottom: 5px;
        }
        .day.weekend .day-number { color: var(--weekend-text-color); }


        .day .task-list-preview {
            font-size: 0.8em;
            color: var(--task-preview-text-color);
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }
        .day.weekend .task-list-preview { color: var(--weekend-text-color); }

        .day .task-list-preview li {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
            cursor: grab; /* Indicate draggable */
            padding: 2px 4px; /* Add padding */
            border-radius: 3px;
            border-bottom: 1px dotted var(--task-preview-border-color);
            display: flex; /* For priority icon */
             align-items: center;
             gap: 4px;
             background-color: rgba(0,0,0,0.02); /* Slight background */
        }
        .day .task-list-preview li:last-child { border-bottom: none; }
        .day .task-list-preview li:hover {
            color: var(--task-preview-hover-color);
             background-color: rgba(0,0,0,0.05);
        }
        .day .task-list-preview li.dragging { /* Style for the item being dragged */
             opacity: 0.5;
             background: #ccc;
        }


        /* Priority Indicator */
        .priority-icon {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 4px; /* Space between icon and text */
             flex-shrink: 0; /* Prevent shrinking */
        }
        .priority-high { background-color: var(--priority-high-color); }
        .priority-medium { background-color: var(--priority-medium-color); }
        .priority-low { background-color: var(--priority-low-color); }
         li.completed .priority-icon { opacity: 0.5; } /* Dim icon when completed */


        /* Task Recurrence Indicator */
        .recurrence-icon {
            font-size: 0.8em;
            margin-left: 4px;
            color: #888;
            cursor: default; /* Indicate it's just an icon */
             flex-shrink: 0;
        }
        body.dark-mode .recurrence-icon { color: #aaa; }

        /* Modal Styles */
        .modal {
            display: flex;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            position: fixed;
            z-index: 1000; /* Ensure modal is on top */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6); /* Darker overlay */
            justify-content: center;
            align-items: center;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .modal-content {
            background-color: var(--modal-bg-color);
            color: var(--modal-text-color);
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: var(--modal-shadow);
            width: 90%;
            max-width: 550px; /* Slightly wider */
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
             position: relative; /* Needed for absolute positioning of close button */
        }

        .modal-content h3 {
            margin-top: 0;
             margin-right: 30px; /* Space for close button */
            color: var(--modal-text-color);
        }

        .modal-task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px; /* Increased height */
            overflow-y: auto;
            border: 1px solid var(--modal-list-border-color);
            border-radius: 5px;
            padding: 10px;
        }

        .modal-task-item {
            display: flex;
            /* justify-content: space-between; Let gap handle spacing */
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--modal-item-border-color);
             gap: 10px; /* Add gap between checkbox, content, and actions */
        }
        .modal-task-item:last-child { border-bottom: none; }

        .modal-task-item .task-content-wrapper { /* New wrapper for icon, text, category, recurrence */
             flex-grow: 1; /* Take up available space */
             display: flex;
             align-items: center;
             gap: 5px;

        #statsProgressFill {
            height: 100%; border-radius: 3px;
            background: linear-gradient(90deg, #28a745, #00c853);
            transition: width 0.5s ease;
        }
        #statsProgressLabel { font-size: 0.78rem; opacity: 0.7; margin-top: 3px; }

        /* ===== CATEGORY COLOR PILLS ===== */
        .category-pill {
            display: inline-block; padding: 2px 8px;
            border-radius: 999px; font-size: 0.75rem;
            font-weight: 600; color: #fff;
            margin-left: auto; flex-shrink: 0;
            white-space: nowrap;
        }

        /* ===== NOTES FIELD ===== */
        .modal-add-task-form textarea,
        .edit-task-form-fields textarea {
            padding: 8px; border-radius: 5px;
            border: 1px solid var(--modal-input-border-color);
            font-size: 0.9rem; resize: vertical; min-height: 58px;
            background: var(--modal-input-bg-color);
            color: var(--modal-input-text-color); width: 100%; box-sizing: border-box;
            font-family: inherit;
        }
        .task-notes-preview {
            font-size: 0.8em; opacity: 0.65; margin-left: 4px;
            font-style: italic; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; max-width: 140px;
        }

        /* ===== TODAY BUTTON ===== */
        #todayButton {
            background: var(--today-border-color);
            color: #fff; font-size: 0.9rem; padding: 5px 10px;
            border: none; margin-left: 5px; white-space: nowrap;
        }
        #todayButton:hover { opacity: 0.85; }

        /* ===== CATEGORY MANAGEMENT ===== */
        #manageCategoriesPanel {
            display: none; padding: 10px 16px;
            background: var(--app-bg-color); border-radius: 8px;
            box-shadow: var(--app-shadow); margin-top: 4px;
            position: absolute; z-index: 200; min-width: 200px;
        }
        #manageCategoriesPanel.open { display: block; }
        #manageCategoriesPanel h4 { margin: 0 0 8px; font-size: 0.9rem; }
        .cat-manage-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 4px 0; border-bottom: 1px solid var(--modal-list-border-color);
            font-size: 0.88rem;
        }
        .cat-manage-item:last-child { border-bottom: none; }
        .cat-delete-btn {
            background: var(--delete-button-bg-color); color: #fff; border: none;
            border-radius: 4px; padding: 2px 7px; font-size: 0.75rem; cursor: pointer;
        }
        .controls-and-search { position: relative; }

        /* ===== GOOGLE SHEETS INTEGRATION PANEL ===== */
        #sheetsSettingsPanel {
            display: none; padding: 14px 18px;
            background: var(--app-bg-color); border-radius: 8px;
            box-shadow: var(--app-shadow); margin-top: 4px;
            position: absolute; z-index: 200; width: 310px; right: 0;
            flex-direction: column; gap: 10px;
        }
        #sheetsSettingsPanel.open { display: flex; }
        #sheetsSettingsPanel h4 { margin: 0; font-size: 0.92rem; font-weight: 700; }
        #sheetsWebhookUrlInput {
            width: 100%; padding: 8px; font-size: 0.82rem; border-radius: 6px;
            border: 1px solid var(--modal-input-border-color);
            background: var(--modal-input-bg-color); color: var(--modal-text-color);
            box-sizing: border-box;
        }
        #sheetsSettingsPanel .panel-buttons {
            display: flex; flex-direction: column; gap: 8px;
        }
        #sheetsSettingsPanel .panel-buttons-row {
            display: flex; gap: 8px;
        }
        #sheetsSettingsPanel .panel-buttons-row button {
            flex: 1;
        }
        #sheetsSettingsPanel button {
            padding: 7px 10px; font-size: 0.8rem; border-radius: 5px;
            cursor: pointer; border: none; font-weight: 600;
        }
        #sheetsConnectBtn { background: var(--header-bg-color); color: var(--header-text-color); }
        #sheetsDisconnectBtn { background: var(--delete-button-bg-color); color: var(--delete-button-text-color); }
        #sheetsPushBtn, #sheetsPullBtn {
            background: var(--modal-input-bg-color); color: var(--modal-text-color);
            border: 1px solid var(--modal-input-border-color) !important;
        }
        #sheetsPushBtn:disabled, #sheetsPullBtn:disabled, #sheetsConnectBtn:disabled {
            opacity: 0.5; cursor: not-allowed;
        }

        /* ===== SYNC STATUS BADGE ===== */
        .sync-badge {
            display: flex; align-items: center; gap: 8px;
            padding: 4px 10px; border-radius: 20px; font-size: 0.78rem;
            font-weight: 600; background: var(--grid-bg-color);
            color: var(--text-color); border: 1px solid var(--modal-input-border-color);
            transition: all 0.3s ease;
        }
        .sync-badge .status-indicator {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block;
        }
        .sync-badge.local .status-indicator { background: #6c757d; }
        .sync-badge.synced .status-indicator { background: #28a745; box-shadow: 0 0 6px #28a745; }
        .sync-badge.syncing .status-indicator { background: #ffc107; box-shadow: 0 0 6px #ffc107; animation: pulse-yellow 1.2s infinite alternate; }
        .sync-badge.offline .status-indicator { background: #dc3545; box-shadow: 0 0 6px #dc3545; }

        @keyframes pulse-yellow {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer"></div>

    <!-- CUSTOM CONFIRM OVERLAY -->
    <div id="confirmOverlay">
        <div id="confirmBox">
            <p id="confirmMessage">Are you sure?</p>
            <div class="confirm-btns">
                <button id="confirmCancelBtn">Cancel</button>
                <button id="confirmOkBtn">Confirm</button>
            </div>
        </div>
    </div>

    <div class="main-layout">
        <div class="calendar-container">
             <!-- HEADER -->
             <div class="calendar-header">
                 <button id="prevMonth" aria-label="Previous Month">&lt;</button>
                 <button id="prevYear" aria-label="Previous Year">&lt;&lt;</button>
                 <h2 id="currentMonthYear">Month Year</h2>
                 <button id="nextYear" aria-label="Next Year">&gt;&gt;</button>
                 <button id="nextMonth" aria-label="Next Month">&gt;</button>
                 <button id="todayButton" aria-label="Go to Today">Today</button>
                 <button id="darkModeToggle" aria-label="Toggle Mode">Light Mode</button>
                 <button id="installAppBtn" style="display: none; background: #28a745; color: #fff;" aria-label="Install Calendar App">📲 Install App</button>
                 <button id="downloadTasksButton" aria-label="Download Tasks (JSON)">Download JSON</button>
                 <input type="file" id="importFile" accept=".json" style="display: none;">
                 <button id="importTasksButton" aria-label="Import Tasks (JSON)">Import JSON</button>
                 <button id="downloadWordReportButton" aria-label="Download Monthly Report (Word)">Report (Word)</button>
                 <button id="toggleMonthViewButton" aria-label="Toggle Month View">Show Month Tasks</button>
             </div>

             <!-- CONTROLS -->
             <div class="controls-and-search">
                  <input type="search" id="searchInput" placeholder="Search tasks..." aria-label="Search Tasks">
                  <div class="filter-controls">
                      <label for="filterCategory" class="sr-only">Filter by Category</label>
                      <select id="filterCategory" aria-label="Filter by Category">
                          <option value="all">All Categories</option>
                      </select>
                      <label for="filterCompletion" class="sr-only">Filter by Completion</label>
                      <select id="filterCompletion" aria-label="Filter by Completion Status">
                          <option value="all">All Status</option>
                          <option value="incomplete">Incomplete</option>
                          <option value="completed">Completed</option>
                      </select>
                      <button id="hideCompletedToggle" aria-pressed="false">Hide Completed</button>
                      <button id="manageCategoriesButton" aria-label="Manage Categories">⚙ Categories</button>
                      <button id="sheetsSettingsButton" aria-label="Google Sheets Connection">📊 Sheets Sync</button>
                  </div>
                  <!-- Category Management Panel -->
                  <div id="manageCategoriesPanel">
                      <h4>Manage Categories</h4>
                      <div id="categoryListContainer"></div>
                  </div>
                  <!-- Google Sheets Sync Panel -->
                  <div id="sheetsSettingsPanel">
                      <h4>Google Sheets Integration</h4>
                      <input type="url" id="sheetsWebhookUrlInput" placeholder="Enter Apps Script Web App URL..." aria-label="Apps Script URL">
                      <div class="panel-buttons">
                          <button id="sheetsConnectBtn">Connect & Sync</button>
                          <div class="panel-buttons-row">
                              <button id="sheetsPushBtn" disabled>Push</button>
                              <button id="sheetsPullBtn" disabled>Pull</button>
                          </div>
                          <button id="sheetsDisconnectBtn" style="display:none;">Disconnect</button>
                      </div>
                  </div>
             </div>

             <!-- STATS BAR -->
             <div id="statsBar">
                 <div class="stat-item"><span class="stat-value" id="statTotal">0</span><span class="stat-label">Tasks</span></div>
                 <div class="stat-item"><span class="stat-value" id="statDone">0</span><span class="stat-label">Done</span></div>
                 <div class="stat-item"><span class="stat-value" id="statPending">0</span><span class="stat-label">Pending</span></div>
                 <div id="statsProgressWrap">
                     <div id="statsProgressBar"><div id="statsProgressFill" style="width:0%"></div></div>
                     <div id="statsProgressLabel">0% complete</div>
                 </div>
                 <!-- Sync Status Badge -->
                 <div id="syncStatusBadge" class="sync-badge local">
                     <span class="status-indicator"></span>
                     <span class="status-text">Local Mode</span>
                 </div>
             </div>

             <!-- CALENDAR GRID -->
            <div class="calendar-app">
                 <div class="calendar-grid" id="calendarGrid" role="grid" aria-labelledby="currentMonthYear">
                     <div class="day-label" role="columnheader">Sun</div>
                     <div class="day-label" role="columnheader">Mon</div>
                     <div class="day-label" role="columnheader">Tue</div>
                     <div class="day-label" role="columnheader">Wed</div>
                     <div class="day-label" role="columnheader">Thu</div>
                     <div class="day-label" role="columnheader">Fri</div>
                     <div class="day-label" role="columnheader">Sat</div>
                     <!-- Day cells will be added here by JS -->
                     </div>
            </div>
        </div>

        <!-- MONTH TASK VIEW (Side Panel) -->
        <div class="month-task-view" id="monthTaskView">
            <span class="close-button" id="closeMonthView" aria-label="Close Month View">&times;</span>
            <h3>Tasks for <span id="monthTaskViewMonthYear"></span></h3>
            <div id="monthTaskListContainer">
                <!-- Month tasks will be populated here by JS -->
            </div>
        </div>
    </div>

    <!-- Task Modal (Add/View Day) -->
    <div id="taskModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <span class="close-button" aria-label="Close Modal">&times;</span>
            <h3 id="modalTitle">Tasks for Date</h3>

            <div class="modal-holiday-checkbox">
                <input type="checkbox" id="isHolidayCheckbox" aria-label="Mark as Holiday or Leave">
                <label for="isHolidayCheckbox">Mark as Holiday/Leave</label>
            </div>

            <ul id="modalTaskList" class="modal-task-list">
                <!-- Tasks will be populated here -->
            </ul>

            <form class="modal-add-task-form" id="addTaskForm">
                 <div class="form-field description-field">
                     <label for="newTaskDescription">Task Description</label>
                     <input type="text" id="newTaskDescription" placeholder="Add New Task" aria-label="Add New Task Description" required>
                 </div>
                 <div class="form-field description-field">
                     <label for="newTaskNotes">Notes (Optional)</label>
                     <textarea id="newTaskNotes" placeholder="Additional notes..." aria-label="Task Notes" rows="2"></textarea>
                 </div>
                 <div class="form-field">
                     <label for="newTaskTime">Time (Optional)</label>
                     <input type="time" id="newTaskTime" aria-label="Task Time">
                 </div>
                 <div class="form-field">
                     <label for="newTaskCategorySelect">Category</label>
                     <select id="newTaskCategorySelect" aria-label="Select Task Category"></select>
                 </div>
                 <div class="form-field">
                      <label for="addNewCategoryInput">Or New Category</label>
                      <input type="text" id="addNewCategoryInput" placeholder="New Category" aria-label="Add New Category">
                 </div>
                  <div class="form-field">
                       <label for="newTaskPriority">Priority</label>
                       <select id="newTaskPriority" aria-label="Select Task Priority">
                           <option value="low">Low</option>
                           <option value="medium" selected>Medium</option>
                           <option value="high">High</option>
                       </select>
                  </div>
                   <div class="form-field">
                        <label for="newTaskRecurrence">Recurring</label>
                        <select id="newTaskRecurrence" aria-label="Select Task Recurrence">
                            <option value="none" selected>None</option>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                   </div>
                   <div class="form-field button-field">
                       <button type="submit" id="addNewTaskButton">Add Task</button>
                   </div>
            </form>
            <input type="hidden" id="modalDate">
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div id="editTaskModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="editTaskModalTitle">
        <div class="modal-content">
            <span class="close-button" id="closeEditModal" aria-label="Close Edit Modal">&times;</span>
            <h3 id="editTaskModalTitle">Edit Task</h3>

            <div class="edit-task-form-fields">
                 <div class="form-field description-field">
                     <label for="editTaskDescription">Task Description</label>
                     <input type="text" id="editTaskDescription" aria-label="Edit Task Description" required>
                 </div>
                 <div class="form-field description-field">
                     <label for="editTaskNotes">Notes (Optional)</label>
                     <textarea id="editTaskNotes" placeholder="Additional notes..." aria-label="Task Notes" rows="2"></textarea>
                 </div>
                 <div class="form-field">
                     <label for="editTaskTime">Time</label>
                     <input type="time" id="editTaskTime" aria-label="Task Time">
                 </div>
                 <div class="form-field">
                     <label for="editTaskCategorySelect">Category</label>
                     <select id="editTaskCategorySelect" aria-label="Select Task Category"></select>
                 </div>
                 <div class="form-field">
                     <label for="editTaskPriority">Priority</label>
                     <select id="editTaskPriority" aria-label="Select Task Priority">
                         <option value="low">Low</option>
                         <option value="medium">Medium</option>
                         <option value="high">High</option>
                     </select>
                 </div>
                 <div class="form-field">
                      <label for="editTaskRecurrence">Recurring</label>
                      <select id="editTaskRecurrence" aria-label="Select Task Recurrence">
                          <option value="none">None</option>
                          <option value="daily">Daily</option>
                          <option value="weekly">Weekly</option>
                          <option value="monthly">Monthly</option>
                          <option value="yearly">Yearly</option>
                      </select>
                 </div>
                  <div class="form-field">
                       <label for="editTaskCompleted">Status</label>
                       <select id="editTaskCompleted" aria-label="Task Status">
                            <option value="false">Incomplete</option>
                            <option value="true">Completed</option>
                       </select>
                  </div>
            </div>

            <div class="edit-task-modal-buttons">
                 <button id="confirmSaveTaskButton" class="save-button">Save Changes</button>
                 <button id="confirmDeleteTaskButton" class="delete-button">Delete Task</button>
                 <button id="confirmDeleteRecurringTaskButton" class="delete-button" style="display: none;">Delete This Occurrence</button>
                 <button id="confirmDeleteAllRecurringTaskButton" class="delete-button" style="display: none;">Delete All Recurring</button>
            </div>

             <input type="hidden" id="editModalDate">
             <input type="hidden" id="editModalTaskIndex">
             <input type="hidden" id="editModalIsRecurringInstance">
             <input type="hidden" id="editModalInstanceDate">
        </div>
    </div>


    <script src="full_page_calendar_task_scheduler.js" defer></script>
</body>
</html>
